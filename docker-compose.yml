name: parse_quotes_task

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_NAME=${MONGODB_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - TESTING_FLAG=true
    depends_on:
      mongodb:
        condition: service_healthy 
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  celery-worker:
    build: .
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_NAME=${MONGODB_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - TESTING_FLAG=true
    healthcheck:
      test: ["CMD", "celery", "-A", "proj.celery", "inspect", "ping", "--timeout=1", "--json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A proj.celery worker --loglevel=info --events

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: 
        [
          "CMD",
          "sh", "-c", 
          "mongosh admin -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-flower:
    build: .
    ports:
      - "5555:5555"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - TESTING_FLAG=true
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy 
    command: celery -A proj.celery flower --port=5555

volumes:
  mongodb_data:
