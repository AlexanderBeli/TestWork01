name: parse_quotes_task

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - TESTING_FLAG=true
    depends_on:
      - mongodb
      - redis
    command: "sh -c 'uvicorn main:app --host 0.0.0.0 --port 8000 --reload'"
    volumes:
      - ./src:/app/app

  celery-worker:
    build: .
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - TESTING_FLAG=true
    depends_on:
      - mongodb
      - redis
    command: celery -A proj.celery worker --loglevel=info
    volumes:
      - ./src:/app/app

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  celery-flower:
    build: .
    ports:
      - "5555:5555"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - TESTING_FLAG=true
    depends_on:
      - redis
    command: celery -A proj.celery flower --port=5555

volumes:
  mongodb_data:
